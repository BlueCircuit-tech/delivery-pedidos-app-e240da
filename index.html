<!DOCTYPE html>

<head>

            marca: {
              50: '#f0fdf4',

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      min-height: 100vh;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    [data-tela]:not(.hidden) {
      animation: fadeSlideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
    }

    .btn-primary:hover { box-shadow: 0 6px 16px rgba(34, 197, 94, 0.45); }

    .btn-secondary {
      background: white;
      color: #404040;
      border: 1.5px solid #e5e5e5;
    }

    .btn-secondary:hover { background: #fafafa; border-color: #d4d4d4; }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #f5f5f5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .badge-sucesso { background: #dcfce7; color: #15803d; }
    .badge-pendente { background: #ffedd5; color: #c2410c; }
    .badge-cancelado { background: #fee2e2; color: #b91c1c; }
    .badge-info { background: #dbeafe; color: #1d4ed8; }

    .ativo {
      color: #22c55e;
      background: #f0fdf4;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 0.75rem;
      border-radius: 16px;
      color: #737373;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-item:hover { color: #404040; }
    .nav-item.ativo { color: #22c55e; background: #f0fdf4; }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item span { font-size: 0.6875rem; font-weight: 500; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }

    :focus-visible {
      outline: 2px solid #22c55e;
      outline-offset: 2px;
    }

    @media (min-width: 768px) {
      .app-frame {
        width: 390px;
        height: 844px;
        border-radius: 44px;
        box-shadow:
          0 0 0 12px #262626,
          0 0 0 14px #404040,
          0 25px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        position: relative;
        background: white;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px 8px;
        background: #171717;
        color: white;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .status-bar svg { width: 18px; height: 18px; }
    }

    @media (max-width: 767px) {
      .app-frame {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      .status-bar { display: none; }
    }

    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    .toast {
      padding: 0.875rem 1.25rem;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.875rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
      pointer-events: auto;
    }

    .toast-ok { background: #166534; color: white; }
    .toast-erro { background: #b91c1c; color: white; }
    .toast-info { background: #1e40af; color: white; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-10px) scale(0.95); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 340px;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }

    .modal-overlay.open .modal-content { transform: scale(1); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 m-0">

      const IMAGENS_PRODUTO = {

        'fita-crepe': 'from-orange-200 to-orange-400', 'pallet': 'from-yellow-700 to-yellow-900', 'nfe': 'from-emerald-300 to-emerald-500',

      let carrinho = [];
      let categoriaSelecionada = 'todas';
      let filtroPrecoAtual = 'todos';
      let termoBuscaAtual = '';

      function inicializar() {
        renderizarCategorias();
        renderizarProdutos();
        atualizarCarrinho();
      }

      function renderizarCategorias() {
        const container = document.getElementById('catalogo-lista-categorias');
        if (!container) return;
        let html = '<button onclick="catalogo_de_produtos_selecionarCategoria(\'todas\')" class="catalogo-cat-btn flex-shrink-0 flex flex-col items-center justify-center w-[72px] h-[68px] rounded-xl border-2 transition ' + (categoriaSelecionada === 'todas' ? 'border-marca-600 bg-marca-50' : 'border-gray-100 bg-white hover:border-marca-200') + '" data-cat="todas"><span class="text-xl mb-0.5">🏪</span><span class="text-[10px] font-body font-medium ' + (categoriaSelecionada === 'todas' ? 'text-marca-700' : 'text-gray-500') + ' text-center leading-tight">Todos</span></button>';
        CATEGORIAS.forEach(cat => {
          const ativo = categoriaSelecionada === cat.id;
          html += '<button onclick="catalogo_de_produtos_selecionarCategoria(\'' + cat.id + '\')" class="catalogo-cat-btn flex-shrink-0 flex flex-col items-center justify-center w-[72px] h-[68px] rounded-xl border-2 transition ' + (ativo ? 'border-marca-600 bg-marca-50' : 'border-gray-100 bg-white hover:border-marca-200') + '" data-cat="' + cat.id + '"><span class="text-xl mb-0.5">' + cat.icone + '</span><span class="text-[10px] font-body font-medium ' + (ativo ? 'text-marca-700' : 'text-gray-500') + ' text-center leading-tight">' + cat.nome + '</span></button>';
        });
        container.innerHTML = html;
      }

      function getProdutosFiltrados() {
        return PRODUTOS.filter(p => {
          const catMatch = categoriaSelecionada === 'todas' || p.categoria === categoriaSelecionada;
          const precoMatch = filtroPrecoAtual === 'todos' || (filtroPrecoAtual === 'ate50' && p.preco <= 50) || (filtroPrecoAtual === '50a200' && p.preco > 50 && p.preco <= 200) || (filtroPrecoAtual === 'acima200' && p.preco > 200);
          const buscaMatch = !termoBuscaAtual || p.nome.toLowerCase().includes(termoBuscaAtual.toLowerCase()) || p.codigo.toLowerCase().includes(termoBuscaAtual.toLowerCase());
          return catMatch && precoMatch && buscaMatch;
        });
      }

      function renderizarProdutos() {
        const container = document.getElementById('catalogo-grid-produtos');
        const estadoVazio = document.getElementById('catalogo-estado-vazio');
        if (!container || !estadoVazio) return;
        const produtos = getProdutosFiltrados();
        if (produtos.length === 0) {
          container.classList.add('hidden');
          estadoVazio.classList.remove('hidden');
          estadoVazio.classList.add('flex');
          return;
        }
        container.classList.remove('hidden');
        estadoVazio.classList.add('hidden');
        estadoVazio.classList.remove('flex');
        let html = '';
        produtos.forEach(prod => {
          const cat = CATEGORIAS.find(c => c.id === prod.categoria);
          const imgGrad = IMAGENS_PRODUTO[prod.imagem] || 'from-gray-200 to-gray-400';
          const inicial = prod.nome.charAt(0);
          html += '<div onclick="catalogo_de_produtos_abrirDetalhe(' + prod.id + ')" class="card bg-white rounded-2xl p-3 cursor-pointer transition hover:shadow-md active:scale-[0.97] flex flex-col"><div class="w-full aspect-square rounded-xl bg-gradient-to-br ' + imgGrad + ' flex items-center justify-center mb-2.5 relative overflow-hidden"><span class="text-3xl font-display font-bold text-white/90 drop-shadow-sm">' + inicial + '</span><span class="absolute top-1.5 right-1.5 text-[9px] font-body font-medium px-1.5 py-0.5 rounded-md bg-white/80 text-gray-600">' + prod.codigo + '</span></div><p class="text-xs font-body text-gray-800 font-medium leading-snug line-clamp-2 flex-1">' + prod.nome + '</p><div class="flex items-center justify-between mt-2"><span class="text-sm font-body font-bold text-marca-700">' + brl(prod.preco) + '</span><span class="text-[10px] font-body text-gray-400">/' + prod.unidade + '</span></div><button onclick="event.stopPropagation();catalogo_de_produtos_adicionarCarrinho(' + prod.id + ')" class="mt-2 w-full bg-marca-600 text-white text-xs font-body font-semibold py-2 rounded-xl transition hover:bg-marca-700 active:scale-95 flex items-center justify-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-width="2.5" stroke-linecap="round"/></svg>Adicionar</button></div>';
        });
        container.innerHTML = html;
      }

      function getCarrinhoCount() {
        return carrinho.reduce((s, i) => s + i.qtd, 0);
      }

      function atualizarCarrinho() {
        const btn = document.getElementById('catalogo-btn-carrinho');
        const badge = document.getElementById('catalogo-badge-carrinho');
        const count = getCarrinhoCount();
        if (btn) btn.classList.toggle('hidden', count === 0);
        if (badge) {
          badge.textContent = count > 99 ? '99+' : count;
          badge.classList.toggle('scale-0', count === 0);
        }
      }

      function selecionarCategoria(id) {
        categoriaSelecionada = id;
        renderizarCategorias();
        renderizarProdutos();
      }

      function filtrarPreco(faixa) {
        filtroPrecoAtual = faixa;
        document.querySelectorAll('.catalogo-filtro-preco').forEach(b => {
          const ativo = b.dataset.preco === faixa;
          b.className = 'catalogo-filtro-preco flex-1 text-xs font-body py-2 rounded-lg border transition font-medium ' + (ativo ? 'border-marca-600 bg-marca-50 text-marca-700' : 'border-gray-200 bg-white text-gray-600 hover:border-marca-300');
        });
        renderizarProdutos();
      }

      function buscar(termo) {
        termoBuscaAtual = termo.trim();
        renderizarProdutos();
        const resultados = document.getElementById('catalogo-resultados-busca');
        if (!resultados) return;
        if (!termoBuscaAtual) { resultados.innerHTML = ''; return; }
        const encontrados = PRODUTOS.filter(p => p.nome.toLowerCase().includes(termoBuscaAtual.toLowerCase()) || p.codigo.toLowerCase().includes(termoBuscaAtual.toLowerCase()));
        if (encontrados.length === 0) {
          resultados.innerHTML = '<p class="text-center text-sm text-gray-400 font-body py-4">Nenhum resultado para "' + termoBuscaAtual + '"</p>';
          return;
        }
        let html = '';
        encontrados.forEach(prod => {
          html += '<div onclick="catalogo_de_produtos_selecionarResultadoBusca(' + prod.id + ')" class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer transition hover:bg-gray-100 active:scale-[0.98]"><div class="w-10 h-10 rounded-lg bg-gradient-to-br ' + (IMAGENS_PRODUTO[prod.imagem] || 'from-gray-200 to-gray-400') + ' flex items-center justify-center flex-shrink-0"><span class="text-sm font-display font-bold text-white">' + prod.nome.charAt(0) + '</span></div><div class="flex-1 min-w-0"><p class="text-sm font-body font-medium text-gray-800 truncate">' + prod.nome + '</p><p class="text-xs font-body text-gray-400">' + prod.codigo + '</p></div><span class="text-sm font-body font-bold text-marca-700 flex-shrink-0">' + brl(prod.preco) + '</span></div>';
        });
        resultados.innerHTML = html;
      }

      function selecionarResultadoBusca(id) {
        fecharBusca();
        setTimeout(() => abrirDetalhe(id), 200);
      }

      function abrirBusca() {
        const modal = document.getElementById('catalogo-modal-busca');
        if (!modal) return;
        modal.classList.remove('hidden');
        setTimeout(() => {
          const input = document.getElementById('catalogo-input-busca');
          if (input) input.focus();
        }, 100);
      }

      function fecharBusca() {
        const modal = document.getElementById('catalogo-modal-busca');
        if (modal) modal.classList.add('hidden');
        const input = document.getElementById('catalogo-input-busca');
        if (input) input.value = '';
        termoBuscaAtual = '';
        const resultados = document.getElementById('catalogo-resultados-busca');
        if (resultados) resultados.innerHTML = '';
      }

      function abrirDetalhe(id) {
        const prod = PRODUTOS.find(p => p.id === id);
        if (!prod) return;
        const cat = CATEGORIAS.find(c => c.id === prod.categoria);
        const imgGrad = IMAGENS_PRODUTO[prod.imagem] || 'from-gray-200 to-gray-400';
        const modal = document.getElementById('catalogo-modal-detalhe');
        const conteudo = document.getElementById('catalogo-conteudo-detalhe');
        if (!modal || !conteudo) return;
        const noCarrinho = carrinho.find(c => c.id === prod.id);
        const qtdCarrinho = noCarrinho ? noCarrinho.qtd : 0;
        conteudo.innerHTML = '<div class="flex items-center justify-between mb-4"><button onclick="catalogo_de_produtos_fecharDetalhe()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition"><svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-width="2.5" stroke-linecap="round"/></svg></button><span class="text-xs font-body font-medium text-gray-400 bg-gray-100 px-3 py-1 rounded-full">' + prod.codigo + '</span></div><div class="w-full aspect-video rounded-2xl bg-gradient-to-br ' + imgGrad + ' flex items-center justify-center mb-4 relative"><span class="text-6xl font-display font-bold text-white/80">' + prod.nome.charAt(0) + '</span></div><div class="flex items-start justify-between mb-2"><div><p class="text-base font-body font-bold text-gray-900">' + prod.nome + '</p><p class="text-xs font-body text-gray-400 mt-0.5 flex items-center gap-1">' + (cat ? cat.icone + ' ' : '') + (cat ? cat.nome : '') + '</p></div></div><p class="text-sm font-body text-gray-500 leading-relaxed mb-4">' + prod.descricao + '</p><div class="bg-gray-50 rounded-xl p-4 mb-4 space-y-2.5"><div class="flex justify-between"><span class="text-xs font-body text-gray-400">Preço unitário</span><span class="text-sm font-body font-semibold text-gray-800">' + brl(prod.preco) + ' / ' + prod.unidade + '</span></div><div class="flex justify-between"><span class="text-xs font-body text-gray-400">Estoque disponível</span><span class="text-sm font-body font-semibold ' + (prod.estoque > 50 ? 'text-green-600' : 'text-amber-600') + '">' + prod.estoque + ' ' + prod.unidade + '(s)</span></div><div class="flex justify-between"><span class="text-xs font-body text-gray-400">Código</span><span class="text-sm font-body font-medium text-gray-600">' + prod.codigo + '</span></div></div><div class="flex items-center gap-3 mb-5"><span class="text-sm font-body font-medium text-gray-600">Qtd:</span><div class="flex items-center border border-gray-200 rounded-xl overflow-hidden"><button onclick="catalogo_de_produtos_alterarQtdDetalhe(' + prod.id + ', -1)" class="w-10 h-10 flex items-center justify-center bg-gray-50 hover:bg-gray-100 transition text-gray-600 font-body font-bold text-lg active:scale-90">−</button><span id="catalogo-qtd-detalhe" class="w-10 h-10 flex items-center justify-center text-sm font-body font-bold text-gray-800 bg-white">' + Math.max(1, qtdCarrinho) + '</span><button onclick="catalogo_de_produtos_alterarQtdDetalhe(' + prod.id + ', 1)" class="w-10 h-10 flex items-center justify-center bg-gray-50 hover:bg-gray-100 transition text-gray-600 font-body font-bold text-lg active:scale-90">+</button></div></div><button onclick="catalogo_de_produtos_adicionarDoDetalhe(' + prod.id + ')" class="w-full bg-marca-600 text-white font-body font-semibold py-3.5 rounded-xl transition hover:bg-marca-700 active:scale-[0.97] flex items-center justify-center gap-2 shadow-lg shadow-marca-600/20"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="20" cy="21" r="1" fill="currentColor" stroke="none"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Adicionar ao Carrinho</button>';
        modal.classList.remove('hidden');
      }

      function fecharDetalhe() {
        const modal = document.getElementById('catalogo-modal-detalhe');
        if (modal) modal.classList.add('hidden');
      }

      function alterarQtdDetalhe(id, delta) {
        const span = document.getElementById('catalogo-qtd-detalhe');
        if (!span) return;
        let qtd = parseInt(span.textContent) + delta;
        if (qtd < 1) qtd = 1;
        span.textContent = qtd;
      }

      function adicionarCarrinho(id) {
        const prod = PRODUTOS.find(p => p.id === id);
        if (!prod) return;
        const existente = carrinho.find(c => c.id === id);
        if (existente) {
          existente.qtd += 1;
        } else {
          carrinho.push({ id: id, qtd: 1 });
        }
        atualizarCarrinho();
        toast(prod.nome + ' adicionado ao carrinho', 'ok');
      }

      function adicionarDoDetalhe(id) {
        const span = document.getElementById('catalogo-qtd-detalhe');
        const qtd = span ? parseInt(span.textContent) : 1;
        const prod = PRODUTOS.find(p => p.id === id);
        if (!prod) return;
        const existente = carrinho.find(c => c.id === id);
        if (existente) {
          existente.qtd += qtd;
        } else {
          carrinho.push({ id: id, qtd: qtd });
        }
        atualizarCarrinho();
        fecharDetalhe();
        toast(qtd + 'x ' + prod.nome + ' adicionado(s) ao carrinho', 'ok');
      }

      function limparFiltro() {
        categoriaSelecionada = 'todas';
        filtroPrecoAtual = 'todos';
        termoBuscaAtual = '';
        renderizarCategorias();
        filtrarPreco('todos');
        renderizarProdutos();
      }

      function abrirPromocao() {
        toast('Oferta aplicada! Adicione itens de Material de Escritório ao carrinho.', 'info');
      }

      window.catalogo_de_produtos_selecionarCategoria = selecionarCategoria;
      window.catalogo_de_produtos_filtrarPreco = filtrarPreco;
      window.catalogo_de_produtos_buscar = buscar;
      window.catalogo_de_produtos_abrirBusca = abrirBusca;
      window.catalogo_de_produtos_fecharBusca = fecharBusca;
      window.catalogo_de_produtos_abrirDetalhe = abrirDetalhe;
      window.catalogo_de_produtos_fecharDetalhe = fecharDetalhe;
      window.catalogo_de_produtos_alterarQtdDetalhe = alterarQtdDetalhe;
      window.catalogo_de_produtos_adicionarCarrinho = adicionarCarrinho;
      window.catalogo_de_produtos_adicionarDoDetalhe = adicionarDoDetalhe;
      window.catalogo_de_produtos_limparFiltro = limparFiltro;
      window.catalogo_de_produtos_abrirPromocao = abrirPromocao;
      window.catalogo_de_produtos_selecionarResultadoBusca = selecionarResultadoBusca;

      inicializar();
    })();
  </script>
</section>

  <div class="toast-container" id="toastContainer"></div>

    <div class="modal-content">
      <div class="p-5 border-b border-neutral-100 flex items-center justify-between">
        <h3 class="font-display font-semibold text-lg text-neutral-900" id="modalTitulo">Título</h3>
        <button onclick="fecharModal()" class="w-8 h-8 rounded-full hover:bg-neutral-100 flex items-center justify-center transition-colors">
          <svg class="w-5 h-5 text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

  <script>
    // Utilitários Globais
    function brl(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
    }

    function dataBR(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function toast(mensagem, tipo = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast toast-${tipo}`;
      el.textContent = mensagem;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function abrirModal(html, titulo = 'Atenção') {
      document.getElementById('modalTitulo').textContent = titulo;
      document.getElementById('modalCorpo').innerHTML = html;
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function fecharModal(e) {
      if (!e || e.target === document.getElementById('modal') || e.target.tagName === 'BUTTON' && e.target.onclick) {
        document.getElementById('modal').classList.remove('open');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fecharModal();
    });

    // Relógio na status bar
    function atualizarRelogio() {
      const agora = new Date();
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      document.getElementById('horario').textContent = `${horas}:${minutos}`;
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 60000);

    // Roteador
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('catalogo-de-produtos');
    });
  </script>
