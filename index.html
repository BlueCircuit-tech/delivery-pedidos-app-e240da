<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapidex — Delivery Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: { 50:'#FFF7ED',100:'#FFEDD5',200:'#FED7AA',300:'#FDBA74',400:'#FB923C',500:'#F97316',600:'#EA580C',700:'#C2410C',800:'#9A3412',900:'#7C2D12' },
            destaque: { 50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669',700:'#047857' }
          },
          fontFamily: { display:['Outfit','sans-serif'], body:['DM Sans','sans-serif'] },
          boxShadow: { 'marca':'0 4px 14px rgba(249,115,22,0.25)','card':'0 2px 12px rgba(0,0,0,0.06)','nav':'0 -4px 20px rgba(0,0,0,0.08)' },
          borderRadius: { 'marca':'16px','app':'32px' }
        }
      }
    }
  </script>
  <style>
    body{font-family:'DM Sans',sans-serif;background:#1a1a2e;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    @keyframes telaEntrada{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    [data-tela]:not(.hidden){animation:telaEntrada .28s ease-out both;font-family:'DM Sans',sans-serif}
    @keyframes toastEntrada{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastSaida{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
    .ativo{color:#F97316}.ativo svg{fill:#F97316;stroke:#F97316}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
    :focus-visible{outline:2px solid #F97316;outline-offset:2px;border-radius:8px}
    .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;text-transform:uppercase;letter-spacing:.3px}
    .card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:14px;font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:all .15s ease;min-height:48px;touch-action:manipulation}
    .btn:active{transform:scale(0.97)}
    .btn-primario{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff;box-shadow:0 4px 14px rgba(249,115,22,0.35)}
    .btn-primario:hover{box-shadow:0 6px 20px rgba(249,115,22,0.45)}
    .btn-secundario{background:#F3F4F6;color:#374151}
    .btn-secundario:hover{background:#E5E7EB}
  </style>
</head>
<body>

  <div id="moldura" class="mx-auto bg-white overflow-hidden relative" style="width:390px;height:844px;border-radius:40px;border:8px solid #2d2d44;box-shadow:0 25px 80px rgba(0,0,0,0.5),inset 0 0 0 2px #3d3d5c">
    <div class="absolute top-0 left-0 right-0 z-50 flex items-end justify-between px-7 pb-3 pt-2" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 100%);border-radius:32px 32px 0 0">
      <span id="hora" class="text-white text-sm font-semibold font-display tracking-wide"></span>
      <div class="flex items-center gap-1.5">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="5" width="3" height="7" rx="1" fill="#fff" opacity=".9"/><rect x="4.5" y="3.5" width="3" height="8.5" rx="1" fill="#fff" opacity=".8"/><rect x="9" y="1.5" width="3" height="10.5" rx="1" fill="#fff" opacity=".7"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="#fff" opacity=".6"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 2.5C9.8 2.5 11.8 3.4 13.3 4.8L14.5 3.6C12.7 1.9 10.3 1 7.5 1S2.3 1.9.5 3.6L1.7 4.8C3.2 3.4 5.2 2.5 7.5 2.5Z" fill="#fff" opacity=".7"/><path d="M7.5 5.5C9 5.5 10.4 6.2 11.4 7.3L12.6 6.1C11.3 4.7 9.5 3.9 7.5 3.9S3.7 4.7 2.4 6.1L3.6 7.3C4.6 6.2 6 5.5 7.5 5.5Z" fill="#fff" opacity=".85"/><circle cx="7.5" cy="10" r="1.5" fill="#fff"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="2.5" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff" opacity=".9"/><path d="M23 4v4c.8-.5 1.3-1.3 1.3-2s-.5-1.5-1.3-2z" fill="#fff" opacity=".35"/></svg>
      </div>
    </div>

    <main id="app" class="h-full overflow-y-auto overflow-x-hidden pb-20 bg-gray-50">
      <div class="pt-12">
        <!-- TELAS -->
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-center" style="width:390px">
      <div class="w-full bg-white border-t border-gray-100 px-1 pt-1 pb-2 flex justify-around items-start" style="box-shadow:0 -4px 20px rgba(0,0,0,0.08);border-radius:0 0 32px 32px">
        <button data-nav="home-vitrine" onclick="mostrarTela('home-vitrine')" class="nav-btn ativo flex flex-col items-center gap-0.5 pt-1 pb-0.5 px-2 min-w-[56px] min-h-[52px] rounded-xl transition-all duration-200">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-[10px] font-semibold font-display">Início</span>
        </button>
        <button data-nav="categorias" onclick="mostrarTela('categorias')" class="nav-btn flex flex-col items-center gap-0.5 pt-1 pb-0.5 px-2 min-w-[56px] min-h-[52px] rounded-xl text-gray-400 transition-all duration-200">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span class="text-[10px] font-semibold font-display">Categorias</span>
        </button>
        <button data-nav="carrinho-de-pedidos" onclick="mostrarTela('carrinho-de-pedidos')" class="nav-btn relative flex flex-col items-center gap-0.5 pt-1 pb-0.5 px-2 min-w-[56px] min-h-[52px] rounded-xl text-gray-400 transition-all duration-200">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span id="nav-cart-badge" class="hidden absolute -top-0.5 right-2 w-4 h-4 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">0</span>
          <span class="text-[10px] font-semibold font-display">Pedidos</span>
        </button>
        <button data-nav="acompanhar-pedido" onclick="mostrarTela('acompanhar-pedido')" class="nav-btn flex flex-col items-center gap-0.5 pt-1 pb-0.5 px-2 min-w-[56px] min-h-[52px] rounded-xl text-gray-400 transition-all duration-200">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="text-[10px] font-semibold font-display">Acompanhar</span>
        </button>
        <button data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')" class="nav-btn flex flex-col items-center gap-0.5 pt-1 pb-0.5 px-2 min-w-[56px] min-h-[52px] rounded-xl text-gray-400 transition-all duration-200">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span class="text-[10px] font-semibold font-display">Painel</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="toast-container" class="fixed top-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none" style="max-width:340px"></div>

  <div id="modal-backdrop" class="fixed inset-0 z-[9998] hidden items-center justify-center bg-black/50 backdrop-blur-sm p-6">
    <div id="modal-card" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-[80vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h3 id="modal-titulo" class="font-display font-700 text-lg text-gray-900"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" class="p-5 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    var estado = {
      cart: [], cliente: null, pedidoAtual: null, notificacoes: [
        {id:1,titulo:'Pedido #3842 aprovado',mensagem:'Seu pedido foi confirmado e já está sendo preparado.',tempo:'2 min',lida:false,tipo:'sucesso'},
        {id:2,titulo:'Entregador a caminho',mensagem:'Carlos M. está a 1,2 km do local. Chegada em 15 min.',tempo:'18 min',lida:false,tipo:'info'},
        {id:3,titulo:'Promoção: 20% off lanches',mensagem:'Aproveite o desconto em hambúrgueres artesanais hoje!',tempo:'1 hora',lida:true,tipo:'promo'},
        {id:4,titulo:'Avalie seu último pedido',mensagem:'Conte como foi a experiência do pedido #3835.',tempo:'3 horas',lida:true,tipo:'avaliacao'}
      ]
    };

    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) { s.classList.toggle('hidden', s.dataset.tela !== id); });
      document.querySelectorAll('.nav-btn').forEach(function(b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
        if (b.dataset.nav !== id) b.classList.add('text-gray-400');
        else b.classList.remove('text-gray-400');
      });
      window.scrollTo({ top: 0 });
    }

    function toast(mensagem, tipo) {
      var c = document.getElementById('toast-container');
      var cores = {ok:'bg-green-500',erro:'bg-red-500',info:'bg-marca-500',promo:'bg-destaque-500',avaliacao:'bg-purple-500',sucesso:'bg-green-500'};
      var icones = {ok:'✓',erro:'✕',info:'ℹ',promo:'🎉',avaliacao:'⭐',sucesso:'✓'};
      var el = document.createElement('div');
      el.className = (cores[tipo]||cores.info)+' text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium font-body flex items-center gap-2 pointer-events-auto';
      el.style.animation='toastEntrada .3s ease-out';
      el.innerHTML = '<span class="text-lg">'+(icones[tipo]||'ℹ')+'</span><span class="flex-1">'+mensagem+'</span>';
      c.appendChild(el);
      setTimeout(function(){el.style.animation='toastSaida .3s ease-in forwards';setTimeout(function(){el.remove()},300)},3000);
    }

    function abrirModal(titulo, html) {
      document.getElementById('modal-titulo').textContent = titulo;
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal-backdrop').classList.remove('hidden');
      document.getElementById('modal-backdrop').classList.add('flex');
    }
    function fecharModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
      document.getElementById('modal-backdrop').classList.remove('flex');
    }
    document.getElementById('modal-backdrop').addEventListener('click',function(e){if(e.target===this)fecharModal()});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal()});

    function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v)}
    function dataBR(iso){if(!iso)return'';var d=new Date(iso+'T03:00:00');return d.toLocaleDateString('pt-BR')}

    function updateNavBadge() {
      var b = document.getElementById('nav-cart-badge');
      if (!b) return;
      if (estado.cart.length > 0) {
        b.classList.remove('hidden');
        b.textContent = estado.cart.length > 9 ? '9+' : estado.cart.length;
      } else {
        b.classList.add('hidden');
      }
    }

    function addToCart(item, nome, preco, img) {
      var exist = estado.cart.find(function(i){return i.item===item});
      if (exist) { exist.qtd++; } else { estado.cart.push({item:nome,preco:preco,qtd:1,img:img}); }
      updateNavBadge();
      toast(nome + ' adicionado ao pedido', 'ok');
    }

    function removeFromCart(index) {
      estado.cart.splice(index, 1);
      updateNavBadge();
      mostrarTela('carrinho-de-pedidos');
    }

    document.addEventListener('DOMContentLoaded', function() {
      mostrarTela('home-vitrine');
      (function relogio() {
        var agora = new Date();
        var h = agora.getHours().toString().padStart(2,'0');
        var m = agora.getMinutes().toString().padStart(2,'0');
        var el = document.getElementById('hora');
        if (el) el.textContent = h+':'+m;
      })();
      setInterval(function(){var agora=new Date();var h=agora.getHours().toString().padStart(2,'0');var m=agora.getMinutes().toString().padStart(2,'0');var el=document.getElementById('hora');if(el)el.textContent=h+':'+m},30000);
    });
  </script>
</body>
</html>
